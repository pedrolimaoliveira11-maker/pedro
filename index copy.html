<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de IMC</title>

<style>

/* ============================================ */
/* TEMA ESCURO MODERNO - FUNDO PRETO E AZUL */
/* ============================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:30px;
    padding:30px;
    background:linear-gradient(135deg,#0f172a 0%,#020617 100%);
    color:#e2e8f0;
}

/* Card principal */
.card-imc{
    width:100%;
    max-width:450px;
    padding:35px;
    border-radius:20px;
    background:rgba(30,41,55,0.9);
    border:1px solid #334155;
    backdrop-filter:blur(12px);
    box-shadow:
        0 25px 50px -12px rgb(0 0 0 / 40%),
        0 10px 10px -6px rgb(0 0 0 / 30%),
        0 0 0 1px rgba(14,165,233,.1);

    transition:
        transform .3s cubic-bezier(.4,0,.2,1),
        box-shadow .3s cubic-bezier(.4,0,.2,1),
        border-color .2s ease;
}

.card-imc:hover{
    transform:translateY(-6px);

    box-shadow:
        0 35px 60px -15px rgb(0 0 0 / 50%),
        0 0 0 1px rgba(14,165,233,.25);

    border-color:#0ea5e9;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#e0f2fe;
}

.campo{
    margin-bottom:20px;
}

.label-imc{
    display:block;
    margin-bottom:8px;
    color:#94a3b8;
    font-weight:600;
}

.input-imc{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#0f172a;
    border:1px solid #475569;
    color:#f1f5f9;
    font-size:16px;
    transition:all .2s ease;
}

.input-imc:focus{
    outline:none;
    border-color:#0ea5e9;
    box-shadow:0 0 0 4px rgba(14,165,233,.15);
    background:#1e2937;
}

.input-imc::placeholder{
    color:#64748b;
}

.btn-calcular{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;

    background:linear-gradient(
        135deg,
        #0ea5e9 0%,
        #0284c8 100%
    );

    transition:all .3s ease;

    box-shadow:
        0 10px 15px -3px rgb(14 165 233 / 30%),
        0 4px 6px -4px rgb(14 165 233 / 30%);
}

.btn-calcular:hover{
    transform:translateY(-2px);

    background:linear-gradient(
        135deg,
        #0284c8 0%,
        #0369a1 100%
    );

    box-shadow:
        0 20px 25px -5px rgb(14 165 233 / 40%),
        0 8px 10px -6px rgb(14 165 233 / 40%);
}

.btn-calcular:active{
    transform:scale(.985);
}

/* Resultado */

.card-resultado{
    margin-top:20px;
    padding:20px;
    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #0f172a 0%,
            #1e2937 100%
        );

    border:1px solid #334155;
    box-shadow:0 0 25px rgba(14,165,233,.08);

    display:none;
    text-align:center;
}

.resultado-animado{
    animation:fadeInUp .5s cubic-bezier(.34,1.56,.64,1) forwards;
}

.emoji-result{
    font-size:50px;
    margin-bottom:10px;
    filter:drop-shadow(
        0 10px 8px rgb(0 0 0 / 30%)
    );
}

@keyframes fadeInUp{
    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* Tabela IMC */

.tabela-imc{
    width:100%;
    max-width:700px;
    background:#1e2937;
    border:1px solid #334155;
    border-radius:16px;
    overflow:hidden;
}

.tabela-imc table{
    width:100%;
    border-collapse:collapse;
}

.tabela-imc th{
    background:#0f172a;
    color:#e0f2fe;
    padding:14px 20px;
}

.tabela-imc td{
    padding:14px 20px;
    border-top:1px solid #334155;
    color:#cbd5e1;
}

.tabela-imc tr{
    transition:background-color .2s ease;
}

.tabela-imc tr:hover{
    background:rgba(51,65,85,.7);
}

@media(max-width:600px){
    .card-imc{
        padding:25px;
    }
}

</style>
</head>

<body>

<div class="card-imc">

    <h1>Calculadora de IMC</h1>

    <div class="campo">
        <label class="label-imc">Peso (kg)</label>
        <input
            type="number"
            id="peso"
            class="input-imc"
            placeholder="Ex: 72"
        >
    </div>

    <div class="campo">
        <label class="label-imc">Altura (cm)</label>
        <input
            type="number"
            id="altura"
            class="input-imc"
            placeholder="Ex: 175"
        >
    </div>

    <button class="btn-calcular" onclick="calcularIMC()">
        Calcular IMC
    </button>

    <div id="resultado" class="card-resultado">
        <div id="emoji" class="emoji-result"></div>
        <h2 id="valorImc"></h2>
        <p id="classificacao"></p>
    </div>

</div>

<!-- Tabela abaixo da calculadora -->

<div class="tabela-imc">
    <table>
        <thead>
            <tr>
                <th>IMC</th>
                <th>Classificação</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Menor que 18,5</td>
                <td>Abaixo do peso</td>
            </tr>

            <tr>
                <td>18,5 a 24,9</td>
                <td>Peso normal</td>
            </tr>

            <tr>
                <td>25 a 29,9</td>
                <td>Sobrepeso</td>
            </tr>

            <tr>
                <td>30 a 34,9</td>
                <td>Obesidade Grau I</td>
            </tr>

            <tr>
                <td>35 a 39,9</td>
                <td>Obesidade Grau II</td>
            </tr>

            <tr>
                <td>40 ou mais</td>
                <td>Obesidade Grau III</td>
            </tr>
        </tbody>
    </table>
</div>

<script>

function calcularIMC(){

    const peso = parseFloat(
        document.getElementById("peso").value
    );

    const alturaCm = parseFloat(
        document.getElementById("altura").value
    );

    if(
        !peso ||
        !alturaCm ||
        peso <= 0 ||
        alturaCm <= 0
    ){
        alert("Preencha peso e altura corretamente.");
        return;
    }

    const altura = alturaCm / 100;

    const imc = peso / (altura * altura);

    let classificacao = "";
    let emoji = "";

    if(imc < 18.5){
        classificacao = "Abaixo do peso";
        emoji = "⚠️";
    }
    else if(imc < 25){
        classificacao = "Peso normal";
        emoji = "✅";
    }
    else if(imc < 30){
        classificacao = "Sobrepeso";
        emoji = "📈";
    }
    else if(imc < 35){
        classificacao = "Obesidade Grau I";
        emoji = "⚠️";
    }
    else if(imc < 40){
        classificacao = "Obesidade Grau II";
        emoji = "🚨";
    }
    else{
        classificacao = "Obesidade Grau III";
        emoji = "🛑";
    }

    const resultado = document.getElementById("resultado");

    document.getElementById("emoji").innerHTML = emoji;

    document.getElementById("valorImc").innerHTML =
        `IMC: ${imc.toFixed(1)}`;

    document.getElementById("classificacao").innerHTML =
        classificacao;

    resultado.style.display = "block";
    resultado.classList.remove("resultado-animado");

    void resultado.offsetWidth;

    resultado.classList.add("resultado-animado");
}

</script>

</body>
</html>
